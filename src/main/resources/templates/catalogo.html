<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Boutique - Catálogo</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container py-4">
<header class="d-flex justify-content-between mb-4">
    <h1>Boutique de Ropa</h1>
    <div>
        <a href="/ubicacion" class="btn btn-outline-secondary">Ver Ubicación</a>
        <a href="/ventas/login" class="btn btn-outline-info">Módulo Vendedores</a>
        <a href="/admin" class="btn btn-outline-dark">Admin</a>
    </div>
</header>

<div class="row">
    <div class="col-md-4 mb-4" th:each="p : ${productos}">
        <div class="card h-100">
            <img th:src="${p.urlImagen}" class="card-img-top" style="height:250px; object-fit:cover;" alt="Ropa">
            <div class="card-body">
                <h5 class="card-title" th:text="${p.nombre}"></h5>
                <p class="card-text" th:text="${p.descripcion}"></p>
                <h6 class="text-primary" th:text="'$' + ${p.precio}"></h6>
                <small class="text-muted" th:text="'Stock: ' + ${p.stock}"></small>
            </div>
            <div class="card-footer">
                <a th:href="@{/comprar/{id}(id=${p.id})}" class="btn btn-success w-100">Comprar</a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
