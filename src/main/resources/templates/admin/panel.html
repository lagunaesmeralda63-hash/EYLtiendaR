<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Panel Administrador</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container py-4">
<h1>Panel de Administración</h1>
<a href="/admin/producto/nuevo" class="btn btn-primary mb-3">Agregar Nuevo Producto</a>

<h3>Notificaciones de Pedidos</h3>
<table class="table table-bordered mb-5">
    <thead>
    <tr>
        <th>ID</th>
        <th>Cliente</th>
        <th>Dirección</th>
        <th>Teléfono</th>
        <th>Total</th>
        <th>Estado</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="p : ${pedidos}">
        <td th:text="${p.id}"></td>
        <td th:text="${p.clienteNombre}"></td>
        <td th:text="${p.clienteDireccion}"></td>
        <td th:text="${p.clienteTelefono}"></td>
        <td th:text="'$' + ${p.total}"></td>
        <td th:text="${p.estado}"></td>
    </tr>
    </tbody>
</table>

<h3>Catálogo de Productos</h3>
<table class="table table-striped">
    <thead>
    <tr>
        <th>Nombre</th>
        <th>Precio</th>
        <th>Stock</th>
        <th>Acciones</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="prod : ${productos}">
        <td th:text="${prod.nombre}"></td>
        <td th:text="'$' + ${prod.precio}"></td>
        <td th:text="${prod.stock}"></td>
        <td>
            <a th:href="@{/admin/producto/eliminar/{id}(id=${prod.id})}" class="btn btn-danger btn-sm">Eliminar</a>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
