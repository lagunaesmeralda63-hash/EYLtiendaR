<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Nuevo Producto</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container py-4" style="max-width: 500px;">
<h2>Agregar Producto</h2>
<form th:action="@{/admin/producto/guardar}" th:object="${producto}" method="post">
    <div class="mb-3">
        <label>Nombre:</label>
        <input type="text" th:field="*{nombre}" class="form-control" required>
    </div>
    <div class="mb-3">
        <label>Descripción:</label>
        <input type="text" th:field="*{descripcion}" class="form-control" required>
    </div>
    <div class="mb-3">
        <label>Precio:</label>
        <input type="number" step="0.01" th:field="*{precio}" class="form-control" required>
    </div>
    <div class="mb-3">
        <label>Stock:</label>
        <input type="number" th:field="*{stock}" class="form-control" required>
    </div>
    <div class="mb-3">
        <label>URL Imagen:</label>
        <input type="text" th:field="*{urlImagen}" class="form-control" placeholder="https://..." required>
    </div>
    <button type="submit" class="btn btn-success w-100">Guardar Producto</button>
</form>
</body>
</html>
