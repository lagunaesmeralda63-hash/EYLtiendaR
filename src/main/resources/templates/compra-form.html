<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Finalizar Compra</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container py-5" style="max-width: 500px;">
<h2>Confirmar Pedido</h2>
<form th:action="@{/realizar-compra}" th:object="${pedido}" method="post">
    <input type="hidden" th:field="*{producto.id}">
    <input type="hidden" th:field="*{total}">

    <div class="mb-3">
        <label>Nombre Completo:</label>
        <input type="text" th:field="*{clienteNombre}" class="form-control" required>
    </div>
    <div class="mb-3">
        <label>Dirección de Envío:</label>
        <input type="text" th:field="*{clienteDireccion}" class="form-control" required>
    </div>
    <div class="mb-3">
        <label>Teléfono:</label>
        <input type="text" th:field="*{clienteTelefono}" class="form-control" required>
    </div>
    <button type="submit" class="btn btn-primary w-100">Confirmar Compra</button>
</form>
</body>
</html>
