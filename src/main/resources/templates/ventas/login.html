<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Vendedores - Boutique EYL</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --pink-melody: #ff87a9;
            --pink-soft: #ffe3ec;
            --pink-accent: #ff477e;
            --pink-dark: #d6285a;
            --cream-bg: #fff5f8;
            --border-lace: #ffb3c6;
        }

        body {
            font-family: 'Fredoka', cursive, sans-serif;
            background-color: var(--cream-bg);
            background-image:
                    radial-gradient(var(--pink-melody) 1.5px, transparent 1.5px),
                    radial-gradient(var(--pink-melody) 1.5px, var(--cream-bg) 1.5px);
            background-size: 28px 28px;
            background-position: 0 0, 14px 14px;
            color: #52393e;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            background: #ffffff;
            border: 4px solid var(--border-lace);
            border-radius: 35px;
            box-shadow: 0 15px 35px rgba(255, 115, 155, 0.35);
            max-width: 420px;
            width: 100%;
            padding: 2.5rem 2rem 2rem 2rem;
            position: relative;
            text-align: center;
        }

        .login-card::before {
            content: "🎀 MÓDULO DE VENTAS 🎀";
            font-size: 0.85rem;
            font-weight: 700;
            color: #ffffff;
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--pink-accent);
            padding: 4px 20px;
            border-radius: 20px;
            box-shadow: 0 4px 10px rgba(255, 71, 126, 0.4);
            border: 2px solid #ffffff;
        }

        .form-control-kawaii {
            border: 2px solid var(--border-lace);
            border-radius: 20px;
            padding: 0.75rem 1.2rem;
            background-color: #fffafc;
        }

        .btn-kawaii {
            background: linear-gradient(180deg, #ff8dae 0%, var(--pink-accent) 100%);
            color: white;
            border: none;
            border-radius: 25px;
            padding: 0.85rem 1.8rem;
            font-weight: 700;
            box-shadow: 0 6px 15px rgba(255, 71, 126, 0.35);
            transition: transform 0.2s;
        }

        .btn-kawaii:hover {
            transform: translateY(-2px);
            color: white;
        }
    </style>
</head>
<body>

<div class="login-card">
    <div class="mb-3">
        <i class="fa-solid fa-cash-register fa-3x" style="color: var(--pink-accent);"></i>
    </div>

    <h3 class="fw-bold" style="color: var(--pink-dark);">Acceso Vendedores</h3>
    <p class="text-muted small mb-4">Ingresa tus credenciales para operar el punto de venta</p>

    <form th:action="@{/ventas/pos}" method="get">
        <div class="mb-3 text-start">
            <label class="form-label fw-bold small ms-2">🆔 Identificador de Vendedor:</label>
            <input type="text" name="vendedorId" class="form-control form-control-kawaii text-center" placeholder="Ej: VEND-001" required>
        </div>

        <button type="submit" class="btn btn-kawaii w-100 mt-2">
            <i class="fa-solid fa-right-to-bracket me-2"></i> Ingresar al POS
        </button>
    </form>

    <div class="mt-4">
        <a th:href="@{/}" class="text-decoration-none small text-muted">
            <i class="fa-solid fa-arrow-left me-1"></i> Volver a la Tienda
        </a>
    </div>
</div>

</body>
</html>
