server.port=8081

# Conexión MySQL Local
spring.datasource.url=jdbc:mysql://localhost:3306/EYLtienda?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración Hibernate / JPA
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Desactivar caché de Thymeleaf para refrescar cambios
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
# Garantiza que las tablas no se borren ni se reinicien al arrancar


# Carga de imágenes locales
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB